<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Dayflow HRMS</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="bg-light">

  <div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="df-card p-4 p-md-5 shadow-lg" style="max-width: 460px; width: 100%;">
      
      <div class="text-center mb-4">
        <div class="mx-auto mb-3 brand-icon" style="width: 50px; height: 50px; font-size: 1.5rem;">
          <i class="bi bi-key-fill"></i>
        </div>
        <h2 class="fw-bold text-dark mb-1">Forgot password?</h2>
        <p class="text-muted small mb-0">Enter your registered work email and we'll send you instructions to reset your password.</p>
      </div>

      <div id="reset-success-box" class="alert alert-success d-none py-3 small mb-3">
        <i class="bi bi-check-circle-fill me-2"></i> Password reset link sent successfully to your email address!
      </div>

      <form id="forgotForm" onsubmit="handleForgot(event)">
        <div class="mb-3">
          <label for="reset-email" class="form-label-df">Registered Email Address</label>
          <input type="email" class="form-control-df" id="reset-email" placeholder="name@dayflow.com" required value="employee@dayflow.com">
        </div>

        <button type="submit" class="btn btn-primary-df w-100 py-2 mb-3" id="btn-send-reset">
          <span>Send Reset Link</span>
        </button>
      </form>

      <div class="text-center pt-3 border-top">
        <a href="/pages/auth/login.html" class="small text-muted text-decoration-none fw-semibold">
          <i class="bi bi-arrow-left me-1"></i> Back to Sign In
        </a>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script>
    async function handleForgot(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value.trim();
      const btn = document.getElementById('btn-send-reset');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Sending link...';

      try {
        await DayflowAPI.forgotPassword(email);
        document.getElementById('reset-success-box').classList.remove('d-none');
        showToast('Password reset link dispatched!', 'success');
      } catch (err) {
        showToast('Error sending reset link.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Send Reset Link';
      }
    }
  </script>
</body>
</html>
