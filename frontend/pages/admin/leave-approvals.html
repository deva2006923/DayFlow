<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Approvals — Dayflow HRMS</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-wrapper">
    <div id="sidebar-container"></div>

    <div class="app-main">
      <div id="topbar-container"></div>

      <main class="content-body">
        
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
          <div>
            <h1 class="page-title">Leave Approvals & Triage</h1>
            <p class="page-desc mb-0">Review employee leave applications, approve with remarks, or reject with reason.</p>
          </div>
          <div class="d-flex align-items-center gap-2">
            <span class="badge bg-warning-subtle text-warning fw-bold p-2" id="pending-approval-count">1 Pending Request</span>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="df-card mb-4">
          <div class="df-card-body p-3">
            <div class="row align-items-center g-2">
              <div class="col-sm-6">
                <label class="form-label-df mb-1">Filter Applications by Status:</label>
                <select class="form-select-df form-select-sm" id="approval-status-filter">
                  <option value="Pending" selected>Pending Review</option>
                  <option value="Approved">Approved Requests</option>
                  <option value="Rejected">Rejected Requests</option>
                  <option value="All">All Requests</option>
                </select>
              </div>
              <div class="col-sm-6 text-sm-end pt-3 pt-sm-0">
                <div class="text-muted smaller">
                  <i class="bi bi-info-circle me-1"></i> Rejections require mandatory feedback for the employee.
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Approvals List Container -->
        <div id="approvals-list-container">
          <!-- Populated by approvals.js -->
        </div>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/leave.js"></script>
  <script src="/js/approvals.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      DayflowAuth.requireAuth(['hr']);
      DayflowAuth.renderGlobalLayout('adm-approvals');
      DayflowApprovals.init();
    });
  </script>
</body>
</html>
