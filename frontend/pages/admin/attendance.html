<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workforce Attendance — Dayflow HRMS</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-wrapper">
    <div id="sidebar-container"></div>

    <div class="app-main">
      <div id="topbar-container"></div>

      <main class="content-body">
        
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
          <div>
            <h1 class="page-title">Workforce Attendance Logs</h1>
            <p class="page-desc mb-0">Organization-wide daily punch audits, worked hours, and status monitoring.</p>
          </div>
          <button type="button" class="btn btn-outline-df" onclick="DayflowAttendance.exportReport()">
            <i class="bi bi-file-earmark-arrow-down me-1"></i> Export CSV Summary
          </button>
        </div>

        <!-- 4 Summary Stat Cards -->
        <div class="row g-3 mb-4">
          <div class="col-sm-3 col-6">
            <div class="df-card p-3 text-center">
              <div class="text-muted small fw-bold text-uppercase mb-1">Total Present</div>
              <div class="fs-4 fw-extrabold text-success" id="count-present">4</div>
              <div class="smaller text-muted">Active Today</div>
            </div>
          </div>
          <div class="col-sm-3 col-6">
            <div class="df-card p-3 text-center">
              <div class="text-muted small fw-bold text-uppercase mb-1">Total Absent</div>
              <div class="fs-4 fw-extrabold text-danger" id="count-absent">1</div>
              <div class="smaller text-muted">Unreported</div>
            </div>
          </div>
          <div class="col-sm-3 col-6">
            <div class="df-card p-3 text-center">
              <div class="text-muted small fw-bold text-uppercase mb-1">Half Days</div>
              <div class="fs-4 fw-extrabold text-warning" id="count-halfday">0</div>
              <div class="smaller text-muted">4.5 Hrs Logged</div>
            </div>
          </div>
          <div class="col-sm-3 col-6">
            <div class="df-card p-3 text-center">
              <div class="text-muted small fw-bold text-uppercase mb-1">Approved Leave</div>
              <div class="fs-4 fw-extrabold text-primary" id="count-leave">1</div>
              <div class="smaller text-muted">Excused Time-Off</div>
            </div>
          </div>
        </div>

        <!-- Table Card -->
        <div class="df-card">
          <div class="df-card-body p-3">
            
            <!-- Filters Toolbar -->
            <div class="row g-3 mb-4 align-items-center">
              <div class="col-md-7 col-lg-8">
                <div class="search-box-df">
                  <i class="bi bi-search search-icon"></i>
                  <input type="text" class="form-control-df" id="att-search" placeholder="Search by employee name or date..." oninput="DayflowAttendance.renderAttendanceTable()">
                </div>
              </div>
              <div class="col-md-5 col-lg-4">
                <select class="form-select-df" id="att-status-filter" onchange="DayflowAttendance.renderAttendanceTable()">
                  <option value="All" selected>All Attendance Statuses</option>
                  <option value="Present">Present</option>
                  <option value="Absent">Absent</option>
                  <option value="Half Day">Half Day</option>
                  <option value="Leave">On Leave</option>
                </select>
              </div>
            </div>

            <!-- Attendance Table -->
            <div class="table-responsive">
              <table class="table table-df mb-0">
                <thead>
                  <tr>
                    <th>Employee</th>
                    <th>Date</th>
                    <th>Day</th>
                    <th>Check In</th>
                    <th>Check Out</th>
                    <th>Hours Worked</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="attendance-table-body">
                  <!-- Populated by attendance.js with isAdmin=true -->
                </tbody>
              </table>
            </div>

          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/attendance.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      DayflowAuth.requireAuth(['hr']);
      DayflowAuth.renderGlobalLayout('adm-attendance');
      DayflowAttendance.init(true);
    });
  </script>
</body>
</html>
