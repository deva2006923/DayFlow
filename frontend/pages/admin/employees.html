<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management — Dayflow HRMS</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-wrapper">
    <div id="sidebar-container"></div>

    <div class="app-main">
      <div id="topbar-container"></div>

      <main class="content-body">
        
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
          <div>
            <h1 class="page-title">Workforce Directory</h1>
            <p class="page-desc mb-0" id="emp-total-count">Manage employee records, department assignments, and profile updates.</p>
          </div>
          <button type="button" class="btn btn-primary-df" data-bs-toggle="modal" data-bs-target="#addEmployeeModal">
            <i class="bi bi-person-plus-fill me-1"></i> Add Employee
          </button>
        </div>

        <!-- Table Card -->
        <div class="df-card">
          <div class="df-card-body p-3">
            
            <!-- Filters Toolbar -->
            <div class="row g-3 mb-4 align-items-center">
              <div class="col-md-5">
                <div class="search-box-df">
                  <i class="bi bi-search search-icon"></i>
                  <input type="text" class="form-control-df" id="emp-search-input" placeholder="Search by name, ID, email, or role...">
                </div>
              </div>
              <div class="col-md-4">
                <select class="form-select-df" id="emp-dept-filter">
                  <option value="All" selected>All Departments</option>
                  <option value="Engineering">Engineering</option>
                  <option value="Human Resources">Human Resources</option>
                  <option value="Finance">Finance</option>
                  <option value="Operations">Operations</option>
                </select>
              </div>
              <div class="col-md-3">
                <select class="form-select-df" id="emp-status-filter">
                  <option value="All" selected>All Statuses</option>
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
            </div>

            <!-- Employee Table -->
            <div class="table-responsive">
              <table class="table table-df mb-0">
                <thead>
                  <tr>
                    <th>Employee Name</th>
                    <th>ID</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Status</th>
                    <th>Joined</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="employees-table-tbody">
                  <!-- Populated by employees.js -->
                </tbody>
              </table>
            </div>

          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Add Employee Modal -->
  <div class="modal fade" id="addEmployeeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content modal-content-df">
        <div class="modal-header modal-header-df">
          <h5 class="modal-title fw-bold text-dark"><i class="bi bi-person-plus-fill text-primary me-2"></i>Add New Employee</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="addEmployeeForm" onsubmit="DayflowEmployees.handleAddEmployee(event)">
          <div class="modal-body modal-body-df">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="add-emp-name" class="form-label-df">Full Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control-df" id="add-emp-name" placeholder="e.g. Vikram Sharma" required>
              </div>
              <div class="col-md-6">
                <label for="add-emp-email" class="form-label-df">Work Email <span class="text-danger">*</span></label>
                <input type="email" class="form-control-df" id="add-emp-email" placeholder="vikram@dayflow.com" required>
              </div>
              <div class="col-md-6">
                <label for="add-emp-dept" class="form-label-df">Department <span class="text-danger">*</span></label>
                <select class="form-select-df" id="add-emp-dept" required>
                  <option value="" disabled selected>Select Department...</option>
                  <option value="Engineering">Engineering</option>
                  <option value="Human Resources">Human Resources</option>
                  <option value="Finance">Finance</option>
                  <option value="Operations">Operations</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="add-emp-desig" class="form-label-df">Designation <span class="text-danger">*</span></label>
                <input type="text" class="form-control-df" id="add-emp-desig" placeholder="e.g. DevOps Engineer" required>
              </div>
              <div class="col-md-6">
                <label for="add-emp-phone" class="form-label-df">Phone Number</label>
                <input type="text" class="form-control-df" id="add-emp-phone" placeholder="+91 98765 00000">
              </div>
              <div class="col-md-6">
                <label for="add-emp-date" class="form-label-df">Joining Date <span class="text-danger">*</span></label>
                <input type="date" class="form-control-df" id="add-emp-date" required value="2026-08-21">
              </div>
            </div>
          </div>
          <div class="modal-footer modal-footer-df">
            <button type="button" class="btn btn-outline-df" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-df" id="btn-submit-add-emp">Add Employee</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Edit Employee Modal -->
  <div class="modal fade" id="editEmployeeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content modal-content-df">
        <div class="modal-header modal-header-df">
          <h5 class="modal-title fw-bold text-dark"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Employee Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="editEmployeeForm" onsubmit="DayflowEmployees.handleSaveEditEmployee(event)">
          <input type="hidden" id="edit-emp-id-val">
          <div class="modal-body modal-body-df">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="edit-emp-name" class="form-label-df">Full Name</label>
                <input type="text" class="form-control-df" id="edit-emp-name" required>
              </div>
              <div class="col-md-6">
                <label for="edit-emp-email" class="form-label-df">Work Email</label>
                <input type="email" class="form-control-df" id="edit-emp-email" required>
              </div>
              <div class="col-md-6">
                <label for="edit-emp-dept" class="form-label-df">Department</label>
                <select class="form-select-df" id="edit-emp-dept" required>
                  <option value="Engineering">Engineering</option>
                  <option value="Human Resources">Human Resources</option>
                  <option value="Finance">Finance</option>
                  <option value="Operations">Operations</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="edit-emp-desig" class="form-label-df">Designation</label>
                <input type="text" class="form-control-df" id="edit-emp-desig" required>
              </div>
              <div class="col-md-6">
                <label for="edit-emp-status" class="form-label-df">Status</label>
                <select class="form-select-df" id="edit-emp-status">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="edit-emp-phone" class="form-label-df">Phone</label>
                <input type="text" class="form-control-df" id="edit-emp-phone">
              </div>
            </div>
          </div>
          <div class="modal-footer modal-footer-df">
            <button type="button" class="btn btn-outline-df" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-df" id="btn-save-edit-emp">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/employees.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      DayflowAuth.requireAuth(['hr']);
      DayflowAuth.renderGlobalLayout('adm-employees');
      DayflowEmployees.init();
    });
  </script>
</body>
</html>
