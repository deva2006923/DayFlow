services:
  # Backend - Flask API
  - type: web
    name: dayflow-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: "24"

  # Frontend - static HTML/CSS/JS site (frontend/index.html, /pages, /css, /js).
  # frontend/src, package.json, and vite.config.ts are an unused React scaffold
  # left over from an earlier prototype — do NOT build/deploy those; the real
  # UI is the plain static tree served directly with no build step.
  - type: web
    name: dayflow-frontend
    runtime: static
    staticPublishPath: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
